<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#183532">
  <meta name="description" content="Ett första gåprov vid Gamla torget i Kvarnbyn, Mölndal.">
  <title>Gamla torget — Försvara Kvarnbyn</title>
  <style>
    * { box-sizing: border-box }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #183532; color: #f1f0e8; touch-action: none }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
    #canvas { display: block; width: 100%; height: 100%; outline: none }
    #loading { position: fixed; inset: 0; display: flex; align-items: end; padding: max(32px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left)); background: #183532 }
    #loading-content { width: min(390px, 100%); padding-bottom: 4vh }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 6vw, 56px); font-weight: 500; letter-spacing: -1.8px }
    p { line-height: 1.5; font-size: 15px; color: #c3d2c8 }
    #progress { height: 2px; width: 100%; margin: 28px 0 10px; background: #49675a; overflow: hidden }
    #progress-fill { height: 100%; width: 0; background: #b9aa80; transition: width 120ms }
    #notice { color: #f1f0e8; font-size: 13px }
    #retry { display: none; margin-top: 20px; background: #b9aa80; color: #183532; border: 0; border-radius: 6px; padding: 13px 20px; font: inherit; cursor: pointer }
    #landscape { position: fixed; inset: 0; z-index: 4; background: #183532f5; display: none; place-content: center; padding: 30px; text-align: center }
    @media (orientation: portrait) and (pointer: coarse) { #landscape { display: grid } }
    @media (prefers-reduced-motion: reduce) { #progress-fill { transition: none } }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Gå runt vid Gamla torget">Din webbläsare behöver stöd för grafik i en canvas.</canvas>
  <div id="loading"><div id="loading-content">
    <h1>Gamla torget</h1>
    <p>Ett litet utsnitt av Kvarnbyn.<br>Miljön förbereds för en promenad.</p>
    <div id="progress"><div id="progress-fill"></div></div>
    <p id="notice" role="status">Laddar miljön…</p>
    <button id="retry" type="button">Försök igen</button>
  </div></div>
  <div id="landscape"><h2>Vrid telefonen</h2><p>Håll telefonen liggande för att gå runt i kvarteret.</p></div>
  <noscript>JavaScript behöver vara aktiverat för att visa miljön.</noscript>
  <script id="kvarnbyn-debug-state" type="application/json">{}</script>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const engine = new Engine(GODOT_CONFIG);
    const loading = document.getElementById('loading');
    const notice = document.getElementById('notice');
    const progress = document.getElementById('progress-fill');
    const retry = document.getElementById('retry');
    retry.addEventListener('click', () => window.location.reload());
    const missing = Engine.getMissingFeatures({threads: $GODOT_THREADS_ENABLED});
    function failure(error) {
      console.error(error);
      notice.textContent = 'Miljön kunde inte starta. Prova att ladda om sidan eller öppna länken i en annan webbläsare.';
      retry.style.display = 'inline-block';
      progress.style.width = '100%';
      progress.style.background = '#a98576';
      window.__kvarnbynLoadError = String(error);
    }
    if (missing.length) {
      failure(new Error(missing.join(', ')));
    } else {
      window.__kvarnbynLoadStarted = performance.now();
      engine.startGame({
        canvas: document.getElementById('canvas'),
        onProgress(current, total) {
          if (total > 0 && current >= 0) {
            progress.style.width = Math.min(100, current / total * 100) + '%';
            notice.textContent = Math.round(current / 1048576) + ' av ' + Math.round(total / 1048576) + ' MB';
          } else {
            notice.textContent = 'Förbereder kvarteret…';
          }
        },
        onPrint: (...args) => console.log(...args),
        onPrintError: (...args) => console.error(...args),
      }).then(() => {
        let checks = 0;
        const readyCheck = setInterval(() => {
          let state = {};
          try { state = JSON.parse(document.getElementById('kvarnbyn-debug-state').textContent); } catch (_) {}
          if (state.ready) {
            clearInterval(readyCheck);
            loading.remove();
            document.getElementById('canvas').focus();
            window.__kvarnbynLoadFinished = performance.now();
          } else if (++checks > 200) {
            clearInterval(readyCheck);
            failure(new Error('Miljön blev inte redo efter att motorn startade.'));
          }
        }, 100);
      }).catch(failure);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && window.__kvarnbyn) window.__kvarnbyn.command(JSON.stringify({action:'pause'}));
    });
    document.addEventListener('pointerlockchange', () => {
      if (!document.pointerLockElement && window.__kvarnbyn && window.__kvarnbyn.state.player?.active && !window.__kvarnbyn.state.touch) {
        window.__kvarnbyn.command(JSON.stringify({action:'pause'}));
      }
    });
  </script>
</body>
</html>
